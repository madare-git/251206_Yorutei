<!DOCTYPE html>
<html>
<head>
    <title>東京タワーのGoogle Map</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div id="app-container">
        
        <div id="sidebar">
            <h2>🍜 現在近くで夜定食が食べられる飲食店</h2>
            
            <div style="margin-bottom: 20px;">
                <input type="text" placeholder="場所、料理名などで検索..." style="width: 100%; padding: 8px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <div class="display-mode-toggle" style="display: flex; gap: 10px; font-size: 0.9em;">
                <label>
                    <input type="radio" name="displayMode" value="activeOnly" id="modeActive" checked>
                    提供中のみ
                </label>
                <label>
                    <input type="radio" name="displayMode" value="all" id="modeAll">
                    全て表示 (未提供含む)
                </label>
            </div>

            <ul id="shop-list-container" class="shop-list">
                </ul>

        </div>

        <div id="map"></div>
    </div>


    <script type="module">
        
        // =========================================================
        // 1. IMPORT & 初期設定
        // =========================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import {
            getDatabase,
            ref,
            onValue, // リアルタイム監視に必要なonValueのみをインポート
            get,
            push,
            set,
            update,
            remove,
            onChildAdded,
            onChildChanged,
            onChildRemoved
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
        

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "API_KEY",
            projectId: "API_KEY",
            storageBucket: "API_KEY",
            messagingSenderId: "API_KEY",
            appId: "API_KEY"
        };

        // Initialize Firebase　（Firebaseアプリを起動）
        const app = initializeApp(firebaseConfig); //Firebaseに接続
        const db = getDatabase(app);              //RealtimeDBに接続
        const dbRef = ref(db, "Shopinfo");           //RealtimeDB内の"Shopinfoフォルダ"を使う設定

        // グローバル変数・定数
        const listContainer = document.getElementById('shop-list-container'); //Firebaseから取得した全店舗データを格納するために、グローバルスコープで配列を宣言
        const markersObject = {};   // 修正2: マーカーをIDで管理するためのオブジェクトに変更
        let map;
        let infoWindow; 
        let shopLocations = []; // Firebaseから取得したデータを格納する配列
        let userPosition = null; // ユーザーの位置情報を保持する変数

        // ★★★ 表示モード変数とUI要素の追加 ★★★
        let currentDisplayMode = 'activeOnly'; // 初期値は「提供中のみ」
        const modeActiveRadio = document.getElementById('modeActive');
        const modeAllRadio = document.getElementById('modeAll');
    
        // =========================================================
        // 2. データ取得と整形 (Firebase) - リアルタイムリスナー (修正3)
        // =========================================================
        
        // リアルタイムリスナーを開始し、データ更新時に map/list の更新を実行
        function startRealtimeListener() {
            onValue(dbRef, (snapshot) => {
                const shopsData = snapshot.val();
                if (!shopsData) {
                    shopLocations = [];
                    updateMapAndList([]);
                    return;
                }
                
                // データを整形し、グローバル変数に保存
                shopLocations = Object.keys(shopsData).map(key => {
                    const data = shopsData[key];
                    
                    const detailString = `${data.genre} | 評価: ★${data.rating?.toFixed(1) || 0} | ${data.available_seating || 0}席 | ${data.children_policy || '未設定'} | ${data.allergy_policy || '未設定'}`;
                    const isProviding = data.yorutei_status === '提供中' && (data.available_seating > 0);
                    const statusText = isProviding
                                    ? `<span style="color: green; font-weight: 700;">提供中 (${data.available_seating}席)</span>` 
                                    : `<span style="color: red;">${data.yorutei_status || '停止中'}</span>`;

                    return { 
                        ...data, 
                        id: key,
                        lat: parseFloat(data.latitude), 
                        lng: parseFloat(data.longitude),
                        display_detail: detailString,
                        display_status: statusText,
                        isProviding: isProviding // ステータスフラグを追加
                    };
                });

                // マップとリストの更新を実行 
                updateMapAndList(shopLocations);
                console.log("Firebaseデータリアルタイム更新完了。");
            });
        }

        // =========================================================
        // 3. 非同期制御 (Google Maps SDK ロード管理)
        // =========================================================
        
        // Google Maps SDKのロード完了を待つ関数
        function loadGoogleMapsSdk() {
            return new Promise((resolve, reject) => {
                // 既にロードされていたらすぐに解決
                if (window.google && window.google.maps) {
                    return resolve();
                }

                // ロード完了時に実行されるグローバルコールバック関数を定義
                window.googleMapsLoadedCallback = () => {
                    resolve();
                };

                // スクリプトタグを動的に生成し、ロードを開始
                const script = document.createElement('script');
                // const apiKey = "XXXXXXXXXXXXXXXXXXXXXXXXXXXXX"; // ★ご自身のAPIキー★

                script.src = `https://maps.googleapis.com/maps/api/js?key=API_KEY&libraries=marker&callback=googleMapsLoadedCallback&loading=async`;
                
                script.onerror = () => reject(new Error("Google Maps SDKのロードに失敗しました。"));
                
                // ページに挿入し、ロードを開始
                document.head.appendChild(script);
            });
        }

        // ★重要★ Google Maps SDKの読み込み完了時のグローバル関数 (HTMLのcallback属性がなくても機能するよう設定)
        window.googleMapsLoaded = () => {
            // ロードが完了したら Promise を解決する
            if (typeof window.googleMapsLoaded === 'function') {
                window.googleMapsLoaded();
            }
        };

        

        // =========================================================
        // 4. メインロジック (実行順序の統括)
        // =========================================================

        async function main() {
            try{
                // [1] Google Mapsのロード完了を待機
                await loadGoogleMapsSdk(); 
            
                // [2] 地図の初期化（現在地取得とマップオブジェクト生成）
                await initializeMapAndGetUserLocation();
                
                // [3] Firebaseリアルタイムリスナーを開始
                startRealtimeListener();
                
            } catch (error) {
                console.error("メインロジックエラー:", error);
                document.getElementById('map').innerHTML = '地図の表示に失敗しました。コンソールを確認してください。';
            }
             
        }

        // =========================================================
        // 5. 地図初期化ロジック (修正4: Mapオブジェクト生成のみを担当)
        // =========================================================

        // マップの初期化と現在地取得を分離し、Promiseでラップ
        function initializeMapAndGetUserLocation() {
            return new Promise((resolve, reject) => {
                const mapDiv = document.getElementById('map');
                infoWindow = new google.maps.InfoWindow();
                const defaultCenter = { lat: 35.6586, lng: 139.7454 }; // 東京タワー

                // お店用の青いピンを作成する関数（スコープをグローバルに移動）
                function createBlueMarkerElement() {
                    const pinElement = new google.maps.marker.PinElement({
                        background: '#4285F4',
                        borderColor: '#3C73D6',
                        glyphColor: '#fff',
                    });
                    return pinElement.element;
                };

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            userPosition = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                            };
                            
                            map = new google.maps.Map(mapDiv, {
                                zoom: 15,
                                center: userPosition, 
                                mapId: 'XXX' 
                            });
                            
                            // 現在地マーカーを設置
                            const currentLocationMarker = new google.maps.marker.AdvancedMarkerElement({
                                position: userPosition,
                                map: map,
                                title: '現在地',
                            });

                            currentLocationMarker.addListener('click', () => {
                                infoWindow.setContent(`<h3>現在地</h3><p>緯度: ${userPosition.lat.toFixed(5)}, 経度: ${userPosition.lng.toFixed(5)}</p>`);
                                infoWindow.open(map, currentLocationMarker);
                            });
                            
                            resolve(); 
                        },
                        
                        // 失敗時（エラー時）のコールバック関数
                        (error) => {
                            alert('位置情報の取得に失敗しました。デフォルトの位置を表示します。');
                            
                            map = new google.maps.Map(mapDiv, {
                                zoom: 13,
                                center: defaultCenter,
                                mapId: 'D5797e5c2f81a6966dc6fd862' 
                            });
                            resolve(); 
                        },
                        
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );

                } else {
                    alert('お使いのブラウザは位置情報サービスに対応していません。デフォルトの位置を表示します。');
                    
                    map = new google.maps.Map(mapDiv, {
                        zoom: 13,
                        center: defaultCenter,
                        mapId: 'D5797e5c2f81a6966dc6fd862' 
                    });
                    resolve();
                }
            });
        }


        // 修正5: マップとリストの更新ロジック (onValueのコールバックから呼ばれる)
        function updateMapAndList(shopsData) {
            if (!map) return; // 地図がまだ初期化されていなければ何もしない

            // 1. マーカーの追加/更新/削除
            shopsData.forEach((shop) => {
                const existingMarker = markersObject[shop.id];

                if (!existingMarker) {
                // ★★★ 修正箇所：全店舗のマーカーを初回作成 ★★★
                // 初回は全ての店舗のマーカーを作成し、オブジェクトに保存
                const marker = new google.maps.marker.AdvancedMarkerElement({
                    position: { lat: shop.lat, lng: shop.lng },
                    map: map,
                    title: shop.shop_name,
                    // 色分けロジックを適用
                    content: createMarkerElement(shop.isProviding), 
                });

                // ★重要：マーカーオブジェクトに最新のshopデータをカスタムプロパティとして保存
                marker.shopData = shop;
    

                // クリックリスナーの設定
                    marker.addListener('click', () => {
                        // ★クリックされた瞬間に、そのマーカーが保持している最新データを使用する
                        const data = marker.shopData;
                        const content = `
                            <div style="padding:10px;">
                                <h3>${data.shop_name}</h3>
                                <p>${data.display_detail}</p>
                                <hr>
                                <div style="text-align:center;">
                                    <p>予約席数: <input type="number" id="book-count" value="0" min="0" max="${data.available_seating}" style="width:40px;"></p>
                                    <button id="book-btn" style="background:#ff5722; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">
                                        決済して予約する
                                    </button>
                                </div>
                            </div>
                        `;
                        infoWindow.setContent(content);
                        infoWindow.open(map, marker);

                        // ボタンにイベントを付与（DOM描画を待つためにsetTimeoutを使用）
                        setTimeout(() => {
                            document.getElementById('book-btn')?.addEventListener('click', () => {
                                const count = parseInt(document.getElementById('book-count').value);
                                executeBooking(data.id, count); // 予約実行関数へ
                            });
                        }, 100);

                        // リストの連動 (data-idを使用)
                        document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('is-active'));
                        document.querySelector(`.shop-item[data-id="${shop.id}"]`)?.classList.add('is-active');
                    });
                    
                    markersObject[shop.id] = marker; // マーカーをオブジェクトに格納
                    
                } else {
                    // ★★★ 既存マーカーの色とマップへの表示/非表示を更新 ★★★
                    // 既存マーカーの色を最新のステータスで更新
                    existingMarker.content = createMarkerElement(shop.isProviding);
                    
                    // ★重要：既存のマーカーが保持しているデータを最新のものに上書き
                    existingMarker.shopData = shop;

                    // ★追加：もし今、このマーカーのポップアップが開いているなら、中身も即座に更新する
                    if (infoWindow.getMap() && infoWindow.anchor === existingMarker) {
                        infoWindow.setContent(`<h3>${shop.shop_name}</h3><p>${shop.display_detail}</p>`);
                    }
                }

                // 表示モードによる制御
                const shouldBeVisible = (currentDisplayMode === 'all') || (currentDisplayMode === 'activeOnly' && shop.isProviding);
                
                if (shouldBeVisible) {
                    // マーカーを地図に表示
                    if (existingMarker && existingMarker.map === null) {
                        existingMarker.setMap(map);
                    }
                } else {
                    // マーカーを地図から非表示 (activeOnlyモードで未提供の場合)
                    if (existingMarker && existingMarker.map !== null) {
                        existingMarker.setMap(null);
                        if (infoWindow.anchor === existingMarker) {
                            infoWindow.close();
                        }
                    }
                }
            });

            // 2. リストの再生成 (修正6: isProvidingな店舗のみ表示)
            createShopList(shopsData);
        }
        
        // お店用の青いピンを作成する関数 (既存関数を修正)
        function createMarkerElement(isProviding) {
            let color = isProviding ? '#4285F4' : '#BDBDBD'; // 青色 vs. グレー
            
            // Advanced Markerのデフォルトのピン (PinElement) を利用
            const pinElement = new google.maps.marker.PinElement({
                background: color, 
                borderColor: color, 
                glyphColor: '#fff',
            });
            // PinElementのDOM要素を返します
            return pinElement.element;
        };
        
        // createShopList 関数を、isProvidingな店舗のみ表示するように修正
        function createShopList(shops) {
            listContainer.innerHTML = '';
            
            // 表示モードに応じてフィルタリング
            const filteredShops = shops.filter(shop => {
                return currentDisplayMode === 'all' || shop.isProviding;
            });

            filteredShops.forEach((shop) => {
                const listItem = document.createElement('li');
                listItem.className = 'shop-item';
                
                // 提供停止中の店舗はCSSクラスを追加
                if (!shop.isProviding) {
                    listItem.classList.add('is-inactive');
                }
                
                listItem.setAttribute('data-id', shop.id); 
                
                listItem.innerHTML = `
                    <div class="shop-name">${shop.shop_name} (${shop.display_status})</div>
                    <div class="shop-detail">${shop.display_detail}</div>
                `;
                
                listContainer.appendChild(listItem);
            });

            addListClickListeners(); // リスト生成後、クリックリスナーを追加
        }

        // addListClickListeners 関数内のマーカー/データ参照をIDベースに変更
        function addListClickListeners() {
            document.querySelectorAll('.shop-item').forEach(item => {
                item.addEventListener('click', () => {
                    const shopId = item.getAttribute('data-id');
                    // shopLocationsからIDでデータを見つける
                    const shop = shopLocations.find(s => s.id === shopId);
                    const marker = markersObject[shopId]; // IDでマーカーを取得

                    if (!shop || !marker) return;

                    // 1. 地図の中心を店舗の位置に移動
                    map.panTo(marker.position);
                    
                    // 2. InfoWindowの内容を設定し、開く
                    infoWindow.setContent(`<h3>${shop.shop_name}</h3><p>${shop.display_detail}</p>`);
                    infoWindow.open(map, marker);
                    
                    // 3. リストアイテムをハイライト
                    document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('is-active'));
                    item.classList.add('is-active');
                });
            });
        }
        
        // =========================================================
        // 6. モード切り替えイベントの追加
        // =========================================================

        modeActiveRadio.addEventListener('change', () => {
            currentDisplayMode = 'activeOnly';
            // 現在のデータを使って地図とリストを再描画（フィルタリング適用）
            updateMapAndList(shopLocations); 
        });

        modeAllRadio.addEventListener('change', () => {
            currentDisplayMode = 'all';
            // 現在のデータを使って地図とリストを再描画（全表示適用）
            updateMapAndList(shopLocations);
        });

        // 最終実行
        main();

        // =========================================================
    </script>

    

</body>
</html>
