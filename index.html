<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>よる定（YORUTEI） | 今夜の定食</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=__API_KEY__&callback=initMap" defer></script>
    <style>
        /* 地図コンテナ (#map) が親要素の領域を全て占めるように設定 */
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map-view" class="active">
        <header>
            <div class="search-bar">
                <input type="text" placeholder="ジャンルや価格で絞り込む...">
                <button>🔍</button>
            </div>
        </header>
        
        <div class="map-container">
            <div id="map"></div>
            
            <div id="shop-preview" class="shop-preview hidden" data-shop-id="" onclick="showDetail(this.dataset.shopId)">
                <img id="preview-img" src="" alt="定食写真" class="shop-img">
                <div class="shop-info">
                    <p id="preview-name" class="shop-name"></p>
                    <p id="preview-genre" class="shop-genre"></p>
                </div>
                <div class="shop-price">
                    <span id="preview-price" class="price-tag"></span>
                    <span id="preview-distance" class="distance"></span>
                </div>
            </div>
        </div>
        
        <button class="list-toggle-btn">リスト表示に切り替え</button>
    </div>

    <div id="detail-view" class="hidden">
        <header>
            <button onclick="showMap()">← 戻る</button>
            <h1 id="detail-name-header"></h1>
        </header>
        
        <main class="shop-detail-content">
            <div class="image-gallery">
                <img id="detail-img" src="" alt="定食写真1">
            </div>
            
            <section class="info-section">
                <h2 id="detail-menu-title">おまかせ定食</h2>
                <p id="detail-price" class="price-large"></p>
                <div id="detail-tags" class="tags">
                    </div>
                <p id="detail-address" class="address"></p>
            </section>
            
            <section class="action-section">
                <button id="go-button" class="go-button">この店に向かう</button>
                <p id="detail-remaining" class="remaining">残り食数：**わずか**</p>
            </section>
            
            <section class="review-section">
                <h3>ユーザー投稿写真 (スプリント3以降)</h3>
                <div class="user-photos">
                    <img src="https://via.placeholder.com/80x80" alt="ユーザー写真" class="user-photo">
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
